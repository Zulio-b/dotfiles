general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 1 min: Dim screen
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 5
    on-resume = brightnessctl -r
}

# 2 min: Lock screen
listener {
    timeout = 120
    pidof hyprlock || ~/.config/hypr/scripts/lock.sh
}

# 3 min: Screen off 
listener {
    timeout = 180                                                                                  # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

# 4 min: Suspend only if silent (self-checking loop)
listener {
    timeout = 140 #240
    on-timeout = ~/.config/hypr/scripts/smart_suspend.sh
    on-resume = pkill -f smart_suspend.sh
}